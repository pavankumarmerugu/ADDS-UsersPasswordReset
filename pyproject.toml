[project]
name = "adds-sspr"
version = "2.0.0"
description = "Self-service Active Directory password reset for end users"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "C4", "RET", "SIM"]
ignore = [
    "S101",  # pytest relies on assert
    "E501",  # long lines are flagged by the formatter instead
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]  # test fixtures contain fake passwords

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
